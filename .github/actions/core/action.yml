# The app's core in WebAssembly, built into web/pkg: what the site ships and
# the browser tests run on. Shared by CI and the repeated browser tests.
name: Pips core in WebAssembly
description: Builds web/pkg with the wasm-bindgen CLI that matches Cargo.lock.
runs:
  using: composite
  steps:
    # The same Rust as the Rust job in ci.yml: a new release should not
    # change the core the browser tests run without a change here.
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: 1.99.0
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
    # The CLI must match the wasm-bindgen library version in Cargo.lock
    # exactly; build-wasm.sh checks it again.
    - name: wasm-bindgen-cli
      shell: bash
      run: |
        want=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
        have=$(wasm-bindgen --version 2>/dev/null | awk '{ print $2 }' || true)
        [ "$have" = "$want" ] || cargo install wasm-bindgen-cli --version "$want" --locked
    - name: Build
      shell: bash
      run: scripts/build-wasm.sh
