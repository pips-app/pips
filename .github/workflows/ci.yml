# Checks every push to main and every pull request — unstable through its
# pull request into main, or by hand (Run workflow) — and publishes the app
# to GitHub Pages from main. Pages must be set to "GitHub Actions" in the repository
# settings (Settings → Pages → Source).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every action is pinned to a commit, its version beside it: a tag can be
# moved to other code, and these steps build what is published. Raise them
# on purpose (git ls-remote https://github.com/<owner>/<action> refs/tags/<v>).

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — format, lints, tests
    runs-on: ubuntu-24.04
    # Far above a normal run: a hang ends here, not after GitHub's six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned: every Rust release adds lints, and CI should not turn red
      # without a change in this repository. Raise it on purpose.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The fixed copy of rqrr (vendor/rqrr/PIPS.md): its own tests, the fix's among them.
      - run: cargo test --manifest-path vendor/rqrr/Cargo.toml --lib

  # Known vulnerabilities and unsoundness in the dependencies (RustSec).
  # Not needed by the deploy: an advisory published tomorrow should show
  # here, not stop a release of code that did not change.
  audit:
    name: Dependencies — RustSec advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  msrv:
    name: Rust 1.85.1 (declared minimum)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.85.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The tests too: whoever builds with the declared minimum can run them.
      - run: cargo test --workspace

  site:
    name: Web — WebAssembly core, type check, site
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/core
      # One Node for every step here, the browser tests' own.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      # The site is packed first, from the checkout and the core alone,
      # before any step below downloads and runs code from npm (TypeScript,
      # Playwright and their dependencies): what is published holds people's
      # keys, and none of that code gets the chance to change it. The steps
      # below still decide whether it is published (deploy needs this job).
      - run: scripts/build-site.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
      - name: Type-check the app
        run: npx --yes -p typescript@5.9.3 tsc -p web/jsconfig.json
      # The interface's plain parts (layout, filters, springs), without a browser.
      - name: Unit tests of the app
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./tests/gh-annotate.mjs --test-reporter-destination=stdout tests/unit/*.test.mjs
      # The app's journeys in a real browser, with the core just built:
      # import, exchange by QR, refusals, numbered copies, backups.
      - name: Browser tests
        working-directory: tests/e2e
        env:
          # Failures as annotations, readable without the logs.
          ANNOTATE: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=../gh-annotate.mjs --test-reporter-destination=stdout
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox
          npm test -- $ANNOTATE
      # The same journeys in Firefox: it draws and schedules differently,
      # and has caught bugs Chromium did not show.
      - name: Browser tests in Firefox
        working-directory: tests/e2e
        env:
          ANNOTATE: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=../gh-annotate.mjs --test-reporter-destination=stdout
        run: BROWSER=firefox npm test -- $ANNOTATE

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
