[workspace]
# "3": dependency versions are chosen to fit rust-version below, so a
# `cargo update` cannot quietly raise the minimum Rust.
resolver = "3"
members = ["crates/*"]
# Copies of others' crates with a fix of ours, used through [patch] below.
exclude = ["vendor"]

[workspace.package]
edition = "2021"
# Edition 2024 in our dependencies (zeroize) sets the floor; checked in CI.
rust-version = "1.85.1"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

# Dependencies (curve25519, sha2, deflate) are optimised even in debug
# builds: tests run thousands of signature checks. Our own code stays
# unoptimised so it debugs well.
[profile.dev.package."*"]
opt-level = 2

# rqrr 0.11.0 with fixes (vendor/rqrr/PIPS.md): a camera frame could make
# it panic, which WebAssembly cannot catch, or search for seconds. Back to
# crates.io once a release carries the fixes.
[patch.crates-io]
rqrr = { path = "vendor/rqrr" }
